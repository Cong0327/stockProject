server:
  port: 8080

spring:
  application:
    name: stock-backend
  datasource:
    url: jdbc:h2:mem:stockdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

stock:
  api:
    key: ${STOCK_API_KEY:demo}
    base-url: https://api.twelvedata.com

logging:
  level:
    example.stock: DEBUG
